<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clock</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clock">
<style>
  /* Written for Safari 12: no flex "gap", no newer CSS functions. */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; position: fixed;
    background: #05070d; color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    cursor: default;
  }

  /* Background follows the current weather. Kept dark so the clock stands out. */
  #sky, #shade { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
  #sky { background: linear-gradient(160deg, #05070d, #141a26); }
  .mood-clear  #sky { background: linear-gradient(160deg, #0a2f5c, #1f6a9e); }
  .mood-cloudy #sky { background: linear-gradient(160deg, #1d2530, #3f4d5e); }
  .mood-fog    #sky { background: linear-gradient(160deg, #24282e, #4a5259); }
  .mood-rain   #sky { background: linear-gradient(160deg, #0f1b2a, #2b4259); }
  .mood-snow   #sky { background: linear-gradient(160deg, #27323f, #566a7f); }
  .mood-storm  #sky { background: linear-gradient(160deg, #130f28, #352e55); }
  .mood-clear.night #sky { background: linear-gradient(160deg, #050817, #17214a); }
  #shade { background: #000; opacity: 0; }
  .night #shade { opacity: 0.45; }
  .mood-clear.night #shade { opacity: 0; }

  #app {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    padding: 2.5vmin 3vmin 3vmin;
    box-sizing: border-box;
  }

  /* Clock: sized by width so it always fits on one line. */
  #top {
    -webkit-flex: 1 1 auto; flex: 1 1 auto;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    min-height: 0;
  }
  #time {
    font-size: 34vw; line-height: 0.92; font-weight: 500;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    text-shadow: 0 0.6vmin 3vmin rgba(0, 0, 0, 0.35);
  }
  #info {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    max-width: 100%;
    margin-top: 1vmin;
    font-size: 5.2vmin; font-weight: 500; color: #fff;
    text-shadow: 0 0.2vmin 1vmin rgba(0, 0, 0, 0.35);
  }
  #date { white-space: nowrap; -webkit-flex: 0 0 auto; flex: 0 0 auto; }
  #dot { margin: 0 1.6vmin; color: rgba(255, 255, 255, 0.45); -webkit-flex: 0 0 auto; flex: 0 0 auto; }

  /* Weather panels */
  #bottom {
    -webkit-flex: 0 0 auto; flex: 0 0 auto;
    display: -webkit-flex; display: flex;
    margin-top: 2.5vmin;
  }
  .panel {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2.2vmin;
    padding: 2.4vmin 3vmin;
    box-sizing: border-box;
    min-width: 0;
  }
  #now {
    -webkit-flex: 0 0 58%; flex: 0 0 58%;
    margin-right: 2vmin;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
  }
  #nowIcon { width: 14vmin; height: 14vmin; margin-right: 1.5vmin; -webkit-flex: 0 0 auto; flex: 0 0 auto; }
  #nowIcon svg, .icon svg { display: block; width: 100%; height: 100%; }
  #nowTemp {
    font-size: 14vmin; line-height: 1; font-weight: 500;
    margin-right: 3vmin; white-space: nowrap;
    -webkit-flex: 0 0 auto; flex: 0 0 auto;
  }
  #nowText { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; }

  #place {
    display: block; min-width: 0; margin: 0; padding: 1vmin 0;
    border: 0; background: none; color: inherit; text-align: left;
    font: inherit;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    cursor: pointer; -webkit-appearance: none;
  }
  #place svg { width: 4.2vmin; height: 4.2vmin; margin-right: 0.8vmin; vertical-align: -0.5vmin; }
  #nowDesc {
    font-size: 3.2vmin; color: rgba(255, 255, 255, 0.8); margin-bottom: 1vmin;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .hilo { font-size: 4.2vmin; line-height: 1.2; font-weight: 500; white-space: nowrap; }
  .hilo .lbl {
    display: inline-block; width: 7vmin;
    font-size: 2.8vmin; font-weight: 400; color: rgba(255, 255, 255, 0.7);
  }

  #outlook {
    -webkit-flex: 1 1 0; flex: 1 1 0;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-justify-content: center; justify-content: center;
  }
  .day {
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    font-size: 3.2vmin; line-height: 1;
    padding: 0.9vmin 0;
  }
  .day .name { width: 7.5vmin; font-weight: 500; }
  .day .icon { width: 5.2vmin; height: 5.2vmin; margin-right: 1.8vmin; }
  .day .low, .day .high { width: 7vmin; white-space: nowrap; }
  .day .low { color: rgba(255, 255, 255, 0.7); text-align: right; margin-right: 1.5vmin; }
  .day .high { text-align: left; margin-left: 1.5vmin; font-weight: 500; }

  /* Low-to-high temperature bars, on a fixed scale. The gradient spans the whole
     scale (see placeBar), so a given temperature is always the same color. */
  .bar {
    position: relative; height: 1.4vmin; border-radius: 0.7vmin;
    background: rgba(255, 255, 255, 0.16);
    -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0;
  }
  .fill {
    position: absolute; top: 0; bottom: 0; left: 0; width: 0;
    border-radius: 0.7vmin;
    background-image: linear-gradient(90deg, #6cc4ff, #ffd166 60%, #ff9f5a);
    background-repeat: no-repeat;
  }

  #status {
    position: absolute; top: 2vmin; left: 0; right: 0;
    text-align: center; font-size: 2.2vmin; color: #ffc46b;
  }

  /* Portrait: time and date on top, then current weather and the 3-day outlook
     each across the full width. Landscape uses the styles above unchanged. */
  @media (orientation: portrait) {
    #app { padding: 3vmin 3vmin 3.5vmin; }
    #time { font-size: 38vw; }
    #info {
      -webkit-flex-direction: column; flex-direction: column;
      font-size: 5.6vmin; margin-top: 2vmin;
    }
    #dot { display: none; }
    #place { max-width: 100%; padding: 0.6vmin 0; }
    #place svg { width: 4.6vmin; height: 4.6vmin; }

    #bottom {
      -webkit-flex-direction: column; flex-direction: column;
      margin-top: 3vmin;
    }
    #now {
      -webkit-flex: 0 0 auto; flex: 0 0 auto;
      margin-right: 0; margin-bottom: 2.5vmin;
      padding: 5vmin 4vmin;
    }
    #nowIcon { width: 17vmin; height: 17vmin; margin-right: 3vmin; }
    #nowTemp { font-size: 19vmin; margin-right: 4vmin; }
    #nowDesc { font-size: 3.6vmin; margin-bottom: 1.6vmin; }
    .hilo { font-size: 6vmin; }
    .hilo .lbl { font-size: 3.8vmin; width: 9.5vmin; }

    #outlook {
      -webkit-flex: 0 0 auto; flex: 0 0 auto;
      padding: 3.5vmin 5vmin;
    }
    .day { font-size: 4.6vmin; padding: 1.6vmin 0; }
    .day .name { width: 11vmin; }
    .day .icon { width: 7.5vmin; height: 7.5vmin; margin-right: 3vmin; }
    .day .low, .day .high { width: 10vmin; }
    .day .low { margin-right: 2.5vmin; }
    .day .high { margin-left: 2.5vmin; }
    .bar { height: 1.8vmin; border-radius: 0.9vmin; }
    .fill { border-radius: 0.9vmin; }
  }

  /* Dark mode for night hours: black background and dim, warm text, so the
     screen gives off as little light as possible. */
  html.dark, html.dark body { background: #000; color: #736c61; }
  .dark #sky, .dark #shade { display: none; }
  .dark #time, .dark #info { text-shadow: none; }
  .dark #info { color: #736c61; }
  .dark #dot { color: #3d3933; }
  .dark #nowDesc, .dark .hilo .lbl, .dark .day .low { color: #5c564d; }
  .dark #status { color: #8a6f45; }
  .dark .panel { background: #0c0b0a; }
  .dark .bar { background: #1c1a17; }
  .dark .fill { opacity: 0.45; }
  .dark #nowIcon, .dark .icon { opacity: 0.45; }
  .dark #place svg { opacity: 0.55; }

  /* Location dialog */
  #dialog {
    display: none;
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(0, 0, 0, 0.6);
  }
  #dialog.open { display: block; }
  #dialogBox {
    position: relative;
    width: 76vmin; margin: 4vmin auto 0; padding: 3vmin;
    box-sizing: border-box;
    background: #1c232e; color: #fff;
    border-radius: 2.2vmin;
    font-size: 3vmin;
  }
  #dialogTitle { font-size: 3.6vmin; font-weight: 500; margin-bottom: 2vmin; }
  #searchForm { display: -webkit-flex; display: flex; margin: 0; }
  #searchInput {
    -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0;
    margin: 0 1.5vmin 0 0; padding: 1.6vmin 2vmin;
    border: 0; border-radius: 1.2vmin;
    background: #fff; color: #000;
    font: inherit; font-size: 3.2vmin;
    -webkit-appearance: none;
    /* Without this, the page-wide "no selecting" rule stops typing on iOS. */
    -webkit-user-select: text; user-select: text;
  }
  .dialogBtn {
    margin: 0; padding: 1.6vmin 2.6vmin;
    border: 0; border-radius: 1.2vmin;
    background: rgba(255, 255, 255, 0.16); color: inherit;
    font: inherit; cursor: pointer; -webkit-appearance: none;
  }
  #searchBtn { -webkit-flex: 0 0 auto; flex: 0 0 auto; background: #2f7fd1; color: #fff; }
  #searchMsg { margin-top: 2vmin; color: rgba(255, 255, 255, 0.75); }
  #searchMsg:empty { display: none; }
  .result {
    display: block; width: 100%; margin: 1vmin 0 0; padding: 1.3vmin 2vmin;
    border: 0; border-radius: 1.2vmin; box-sizing: border-box;
    background: rgba(255, 255, 255, 0.08); color: inherit;
    font: inherit; text-align: left; cursor: pointer; -webkit-appearance: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .result small { display: block; font-size: 2.3vmin; color: rgba(255, 255, 255, 0.65); overflow: hidden; text-overflow: ellipsis; }
  #dialogActions {
    display: -webkit-flex; display: flex;
    -webkit-justify-content: space-between; justify-content: space-between;
    margin-top: 2.4vmin;
  }
  #credit { margin-top: 1.6vmin; font-size: 2vmin; color: rgba(255, 255, 255, 0.5); text-align: right; }
  .dark #dialog { background: rgba(0, 0, 0, 0.8); }
  .dark #dialogBox { background: #12100d; color: #8d8577; }
  .dark #searchInput { background: #2a2620; color: #a59c8c; }
  .dark #searchBtn { background: #3a342b; color: #a59c8c; }
  .dark #searchMsg, .dark .result small, .dark #credit { color: #736c61; }
</style>
</head>
<body>
<div id="sky"></div>
<div id="shade"></div>
<div id="app">
  <div id="top">
    <div id="time">--:--</div>
    <div id="info">
      <span id="date"></span>
      <span id="dot">&middot;</span>
      <button id="place" type="button"></button>
    </div>
  </div>
  <div id="bottom">
    <div id="now" class="panel">
      <div id="nowIcon"></div>
      <div id="nowTemp">--&deg;</div>
      <div id="nowText">
        <div id="nowDesc">&nbsp;</div>
        <div class="hilo"><span class="lbl">High</span><span id="high">--</span></div>
        <div class="hilo"><span class="lbl">Low</span><span id="low">--</span></div>
      </div>
    </div>
    <div id="outlook" class="panel">
      <div class="day"><span class="name" id="d1n"></span><span class="icon" id="d1i"></span><span class="low" id="d1l"></span><span class="bar"><span class="fill" id="d1b"></span></span><span class="high" id="d1h"></span></div>
      <div class="day"><span class="name" id="d2n"></span><span class="icon" id="d2i"></span><span class="low" id="d2l"></span><span class="bar"><span class="fill" id="d2b"></span></span><span class="high" id="d2h"></span></div>
      <div class="day"><span class="name" id="d3n"></span><span class="icon" id="d3i"></span><span class="low" id="d3l"></span><span class="bar"><span class="fill" id="d3b"></span></span><span class="high" id="d3h"></span></div>
    </div>
  </div>
  <div id="status"></div>
</div>
<div id="dialog">
  <div id="dialogBox">
    <div id="dialogTitle">Change location</div>
    <form id="searchForm" action="#">
      <input id="searchInput" type="text" placeholder="City, district or postcode" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
      <button id="searchBtn" class="dialogBtn" type="submit">Search</button>
    </form>
    <div id="searchMsg"></div>
    <div id="results"></div>
    <div id="dialogActions">
      <button id="useDevice" class="dialogBtn" type="button">Use my current location</button>
      <button id="closeDialog" class="dialogBtn" type="button">Cancel</button>
    </div>
    <div id="credit">Search by OpenStreetMap</div>
  </div>
</div>

<script>
/* Plain ES5 on purpose: this has to run on Safari 12 (iOS 12.5.8). */
(function () {
  'use strict';

  /* ---------- Settings ---------- */
  var CONFIG = {
    fahrenheit: false,    /* false = Celsius */
    use24Hour: false,     /* true = 24-hour clock */
    darkFromHour: 21,     /* dark mode starts at 9 p.m. */
    darkUntilHour: 6,     /* dark mode ends at 6 a.m. */
    scaleLow: 0,          /* left end of the temperature bars */
    scaleHigh: 30         /* right end of the temperature bars */
  };

  /* Add ?mode=dark or ?mode=day to the address to preview a mode at any time. */
  var modeMatch = /[?&]mode=(dark|day)/.exec(location.search);
  var forcedMode = modeMatch ? modeMatch[1] : '';
  /* ------------------------------ */

  var MINUTE = 60 * 1000;
  var HOUR = 60 * MINUTE;
  var REFRESH_EVERY = 15 * MINUTE;
  var RETRY_AFTER = MINUTE;
  var STALE_AFTER = HOUR;
  var LOCATE_RETRY_AFTER = 5 * MINUTE;
  var LOCATE_TIMEOUT = 30 * 1000;
  var DEVICE_RECHECK = HOUR;
  var DIALOG_IDLE = 2 * MINUTE;
  var WEATHER_KEY = 'weather-v2';
  var PLACE_KEY = 'place-v2';

  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
    'August', 'September', 'October', 'November', 'December'];

  var SEARCH_URL = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=en&q=';
  var GEOCODE_URL = 'https://api.bigdatacloud.net/data/reverse-geocode-client?localityLanguage=en';
  var WEATHER_URL = 'https://api.open-meteo.com/v1/forecast' +
    '?current=temperature_2m,weather_code,is_day' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
    '&timezone=auto&forecast_days=5' +
    (CONFIG.fahrenheit ? '&temperature_unit=fahrenheit' : '');

  /* source: 'device' (the iPad's own position), 'manual' (chosen by hand) or
     'ip' (estimated from the internet connection). */
  var place = null;        /* { lat, lon, name, source, denied } */
  var locateToken = 0;     /* only the newest location request may change the place */
  var nextDeviceCheck = 0;
  var deviceCheckPending = false;
  var locationDenied = false;
  var dialogOpen = false;
  var dialogTouched = 0;
  var searchToken = 0;
  var weather = null;      /* { data, fetchedAt, lat, lon } */
  var nextFetch = 0;
  var fetching = false;
  var locating = false;
  var nextLocate = 0;
  var lastTime = '';
  var lastDay = '';
  var lastStatus = '';
  var lastDark = null;
  var loadedAt = Date.now();
  var nextReloadCheck = 0;

  function $(id) { return document.getElementById(id); }
  function setText(id, value) { $(id).textContent = value; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  function dayKey(d) {
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function formatTime(d) {
    var h = d.getHours();
    if (CONFIG.use24Hour) { return pad(h) + ':' + pad(d.getMinutes()); }
    return (h % 12 || 12) + ':' + pad(d.getMinutes());
  }

  /* ---------- Icons ---------- */

  function svg(body) {
    return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' + body + '</svg>';
  }
  var SUN_RAYS = '<g stroke="#ffc83d" stroke-width="4" stroke-linecap="round">' +
    '<path d="M32 6v7M32 51v7M6 32h7M51 32h7M13.6 13.6l5 5M45.4 45.4l5 5M13.6 50.4l5-5M45.4 18.6l5-5"/></g>';
  var CLOUD_PATH = 'M19 50a11 11 0 0 1-1.500-21.900a15 15 0 0 1 28.800-3.300a12.500 12.500 0 0 1 .700 25.200z';
  function cloud(color, dy) {
    return '<path transform="translate(0 ' + dy + ')" fill="' + color + '" d="' + CLOUD_PATH + '"/>';
  }
  function behind(art) {
    return '<g transform="translate(-6 -8) scale(.72)">' + art + '</g>';
  }
  var SUN_ART = SUN_RAYS + '<circle cx="32" cy="32" r="13" fill="#ffc83d"/>';
  var MOON_ART = '<path fill="#e8e4c9" d="M44 46A21 21 0 0 1 26 10a21 21 0 1 0 25 29a21 21 0 0 1-7 7z"/>';
  var WHITE = '#e6ecf3';
  var GREY = '#b4bfcc';
  function lines(color, d) {
    return '<path stroke="' + color + '" stroke-width="4" stroke-linecap="round" fill="none" d="' + d + '"/>';
  }

  var ICONS = {
    sun: svg(SUN_ART),
    moon: svg(MOON_ART),
    partlyDay: svg(behind(SUN_ART) + cloud(WHITE, 4)),
    partlyNight: svg(behind(MOON_ART) + cloud(GREY, 4)),
    cloud: svg(cloud(WHITE, 0)),
    fog: svg(cloud(GREY, -8) + lines(WHITE, 'M14 50h36M20 58h24')),
    drizzle: svg(cloud(WHITE, -8) + lines('#6cc4ff', 'M22 50l-2 6M33 50l-2 6M44 50l-2 6')),
    rain: svg(cloud(GREY, -8) + lines('#6cc4ff', 'M21 48l-4 11M32 48l-4 11M43 48l-4 11')),
    snow: svg(cloud(WHITE, -8) +
      '<g fill="#fff"><circle cx="20" cy="51" r="3"/><circle cx="32" cy="57" r="3"/><circle cx="44" cy="51" r="3"/></g>'),
    storm: svg(cloud(GREY, -8) + '<path fill="#ffc83d" d="M35 38L23 53h8l-3 10 13-16h-8z"/>')
  };
  var PIN = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M12 1a8 8 0 0 0-8 8c0 5.800 8 14 8 14s8-8.200 8-14a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>';

  /* WMO weather codes used by Open-Meteo. */
  function describe(code, night) {
    if (code === 0) { return { text: 'Clear', icon: night ? 'moon' : 'sun', mood: 'clear' }; }
    if (code === 1) { return { text: 'Mostly clear', icon: night ? 'partlyNight' : 'partlyDay', mood: 'clear' }; }
    if (code === 2) { return { text: 'Partly cloudy', icon: night ? 'partlyNight' : 'partlyDay', mood: 'cloudy' }; }
    if (code === 3) { return { text: 'Overcast', icon: 'cloud', mood: 'cloudy' }; }
    if (code === 45 || code === 48) { return { text: 'Fog', icon: 'fog', mood: 'fog' }; }
    if (code >= 51 && code <= 55) { return { text: 'Drizzle', icon: 'drizzle', mood: 'rain' }; }
    if (code === 56 || code === 57) { return { text: 'Freezing drizzle', icon: 'drizzle', mood: 'rain' }; }
    if (code >= 61 && code <= 65) { return { text: 'Rain', icon: 'rain', mood: 'rain' }; }
    if (code === 66 || code === 67) { return { text: 'Freezing rain', icon: 'rain', mood: 'rain' }; }
    if ((code >= 71 && code <= 77) || code === 85 || code === 86) { return { text: 'Snow', icon: 'snow', mood: 'snow' }; }
    if (code >= 80 && code <= 82) { return { text: 'Showers', icon: 'rain', mood: 'rain' }; }
    if (code === 95 || code === 96 || code === 99) { return { text: 'Thunderstorms', icon: 'storm', mood: 'storm' }; }
    return { text: '', icon: '', mood: '' };
  }

  function setIcon(id, name) { $(id).innerHTML = name ? ICONS[name] : ''; }

  /* ---------- Weather display ---------- */

  function deg(value) {
    return (typeof value === 'number') ? Math.round(value) + '°' : '--';
  }

  /* Positions a day's bar on the fixed scale. Temperatures beyond either end
     stop at that end, and a sliver always stays visible. */
  function placeBar(el, lo, hi) {
    var range = CONFIG.scaleHigh - CONFIG.scaleLow;
    function percent(t) {
      return Math.min(100, Math.max(0, (t - CONFIG.scaleLow) / range * 100));
    }
    var left = percent(lo);
    var width = Math.max(percent(hi) - left, 3);
    if (left + width > 100) { left = 100 - width; }
    el.style.left = left + '%';
    el.style.width = width + '%';
    /* Stretch the gradient to the full scale and show only this bar's part of it. */
    el.style.backgroundSize = (10000 / width) + '% 100%';
    el.style.backgroundPosition = (width >= 100 ? 0 : left / (100 - width) * 100) + '% 0';
  }

  function clearWeather() {
    document.body.className = '';
    setIcon('nowIcon', '');
    setText('nowTemp', '--°');
    setText('nowDesc', ' ');
    setText('low', '--');
    setText('high', '--');
    for (var n = 1; n <= 3; n++) {
      var day = new Date();
      day.setDate(day.getDate() + n);
      setText('d' + n + 'n', DAYS[day.getDay()].slice(0, 3));
      setIcon('d' + n + 'i', '');
      setText('d' + n + 'l', '--');
      setText('d' + n + 'h', '--');
      $('d' + n + 'b').style.width = '0';
    }
  }

  /* A place chosen by hand can be in another time zone, where it may already
     be tomorrow or still be yesterday. */
  function placeDayKey(data, now) {
    if (typeof data.utc_offset_seconds !== 'number') { return dayKey(now); }
    return new Date(now.getTime() + data.utc_offset_seconds * 1000).toISOString().slice(0, 10);
  }

  function dayNameOf(key) {
    var p = key.split('-');
    return DAYS[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()].slice(0, 3);
  }

  function renderWeather() {
    clearWeather();
    if (!weather) { return; }
    var data = weather.data;
    var daily = data.daily;
    var now = new Date();
    var today = daily.time.indexOf(placeDayKey(data, now));
    var night = data.current.is_day === 0;
    var w = describe(data.current.weather_code, night);

    document.body.className = (w.mood ? 'mood-' + w.mood : '') + (night ? ' night' : '');
    setIcon('nowIcon', w.icon);
    setText('nowTemp', deg(data.current.temperature_2m));
    setText('nowDesc', w.text);
    if (today < 0) { return; }

    setText('low', deg(daily.temperature_2m_min[today]));
    setText('high', deg(daily.temperature_2m_max[today]));

    for (var n = 1; n <= 3; n++) {
      var i = today + n;
      if (i >= daily.time.length) { continue; }
      var lo = daily.temperature_2m_min[i];
      var hi = daily.temperature_2m_max[i];
      setText('d' + n + 'n', dayNameOf(daily.time[i]));
      setIcon('d' + n + 'i', describe(daily.weather_code[i], false).icon);
      setText('d' + n + 'l', deg(lo));
      setText('d' + n + 'h', deg(hi));
      placeBar($('d' + n + 'b'), lo, hi);
    }
  }

  function renderStatus(now) {
    var text = '';
    if (weather && now - weather.fetchedAt > STALE_AFTER) {
      var d = new Date(weather.fetchedAt);
      var when = dayKey(d) === dayKey(new Date(now)) ?
        '' : MONTHS[d.getMonth()].slice(0, 3) + ' ' + d.getDate() + ', ';
      text = 'No connection. Weather last updated ' + when + formatTime(d);
    } else if (place && !weather && now - loadedAt > MINUTE) {
      text = 'Can’t load the weather. Still trying…';
    }
    if (text !== lastStatus) {
      lastStatus = text;
      setText('status', text);
    }
  }

  /* ---------- Location ---------- */

  function renderPlace(message) {
    var label = message || (place ? place.name : '');
    /* The small mark means this is only the internet connection's estimate. */
    if (!message && place && isEstimate(place)) { label = '\u2248 ' + label; }
    $('place').innerHTML = PIN;
    $('place').appendChild(document.createTextNode(label));
  }

  function placeName(geo) {
    return geo.city || geo.locality || geo.principalSubdivision || 'Current location';
  }

  /* Places saved by older versions have no source, so they could be an estimate. */
  function isEstimate(p) {
    return p.source !== 'device' && p.source !== 'manual';
  }

  function samePlace(a, b) {
    return !!a && !!b && a.lat === b.lat && a.lon === b.lon;
  }

  function setPlace(next) {
    if (!samePlace(place, next)) {
      weather = null;
      renderWeather();
      nextFetch = 0;
    }
    place = next;
    save(PLACE_KEY, place);
    renderPlace();
  }

  function finishLocating(failed) {
    locating = false;
    if (failed) {
      nextLocate = Date.now() + LOCATE_RETRY_AFTER;
      renderPlace(place ? '' : 'Location unavailable. Tap to choose');
    }
  }

  /* With coordinates: turns them into a place name.
     Without: the service estimates the location from the internet connection. */
  function lookUpPlace(lat, lon, token) {
    var hasCoords = typeof lat === 'number';
    var url = GEOCODE_URL + (hasCoords ? '&latitude=' + lat + '&longitude=' + lon : '');
    var done = false;
    function fail() {
      if (done) { return; }
      done = true;
      if (token !== locateToken) { return; }
      if (hasCoords) {
        /* We know where we are, just not what it's called. Weather still works. */
        setPlace({ lat: lat, lon: lon, name: 'Current location', source: 'device' });
        finishLocating(false);
      } else {
        finishLocating(true);
      }
    }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url);
    xhr.timeout = 20000;
    xhr.onload = function () {
      if (done) { return; }
      if (token !== locateToken) { done = true; return; }
      var geo = null;
      try { geo = xhr.status === 200 ? JSON.parse(xhr.responseText) : null; } catch (e) { geo = null; }
      if (!geo) { fail(); return; }
      var outLat = hasCoords ? lat : round2(geo.latitude);
      var outLon = hasCoords ? lon : round2(geo.longitude);
      if (typeof outLat !== 'number' || isNaN(outLat) || isNaN(outLon)) { fail(); return; }
      done = true;
      var next = { lat: outLat, lon: outLon, name: placeName(geo), source: hasCoords ? 'device' : 'ip' };
      if (!hasCoords) {
        next.denied = locationDenied;
        nextDeviceCheck = Date.now() + DEVICE_RECHECK;
      }
      setPlace(next);
      finishLocating(false);
    };
    xhr.onerror = xhr.ontimeout = xhr.onabort = fail;
    xhr.send();
  }

  function round2(value) { return Math.round(value * 100) / 100; }

  var GEO_OPTIONS = { enableHighAccuracy: true, timeout: 20000, maximumAge: 5 * MINUTE };

  /* Asks the iPad for its position, falling back to the internet connection's
     approximate location if that's refused, fails, or nobody answers the prompt.
     A real position is never replaced by an estimate. */
  function detectPlace() {
    if (locating) { return; }
    locating = true;
    var token = ++locateToken;
    renderPlace('Finding your location…');

    var fellBack = false;
    function fallBack() {
      if (fellBack) { return; }
      fellBack = true;
      if (token !== locateToken) { return; }
      if (place && place.source === 'device') {
        finishLocating(false);
        renderPlace();
        return;
      }
      lookUpPlace(undefined, undefined, token);
    }
    if (!navigator.geolocation) { fallBack(); return; }

    var timer = setTimeout(fallBack, LOCATE_TIMEOUT);
    deviceCheckPending = true; /* so a later check doesn't stack a second prompt */
    navigator.geolocation.getCurrentPosition(function (pos) {
      /* A late answer still wins, because it's more accurate than the estimate. */
      deviceCheckPending = false;
      clearTimeout(timer);
      fellBack = true;
      if (token !== locateToken) { return; }
      token = ++locateToken; /* an estimate still on its way must not overwrite this */
      lookUpPlace(round2(pos.coords.latitude), round2(pos.coords.longitude), token);
    }, function (err) {
      deviceCheckPending = false;
      clearTimeout(timer);
      if (err && err.code === 1) { locationDenied = true; }
      fallBack();
    }, GEO_OPTIONS);
  }

  /* While the place is only an estimate, keep trying quietly for the real one.
     Stops if location access was refused, until someone asks for it again. */
  function checkDeviceLocation(now) {
    nextDeviceCheck = now + DEVICE_RECHECK;
    if (deviceCheckPending || !navigator.geolocation) { return; }
    deviceCheckPending = true;
    var token = ++locateToken;
    navigator.geolocation.getCurrentPosition(function (pos) {
      deviceCheckPending = false;
      if (token === locateToken) {
        lookUpPlace(round2(pos.coords.latitude), round2(pos.coords.longitude), token);
      }
    }, function (err) {
      deviceCheckPending = false;
      if (err && err.code === 1 && token === locateToken && place) {
        place.denied = true;
        save(PLACE_KEY, place);
      }
    }, GEO_OPTIONS);
  }

  /* ---------- Choosing a location ---------- */

  function openDialog() {
    dialogOpen = true;
    dialogTouched = Date.now();
    searchToken++;
    $('dialog').className = 'open';
    $('searchInput').value = '';
    setText('searchMsg', '');
    $('results').innerHTML = '';
    $('searchInput').focus();
  }

  function closeDialog() {
    dialogOpen = false;
    searchToken++;
    $('searchInput').blur();
    $('dialog').className = '';
    window.scrollTo(0, 0); /* iOS can leave the page shifted after the keyboard closes */
  }

  function chooseResult(result) {
    locateToken++; /* cancels any location request still under way */
    locating = false;
    closeDialog();
    setPlace({ lat: result.lat, lon: result.lon, name: result.name, source: 'manual' });
  }

  function addResult(result) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'result';
    btn.appendChild(document.createTextNode(result.name));
    var small = document.createElement('small');
    small.appendChild(document.createTextNode(result.detail || ' '));
    btn.appendChild(small);
    btn.addEventListener('click', function () { chooseResult(result); });
    $('results').appendChild(btn);
  }

  function parseResult(item) {
    var lat = round2(parseFloat(item.lat));
    var lon = round2(parseFloat(item.lon));
    var parts = String(item.display_name || '').split(', ');
    var name = item.name || parts[0];
    if (!name || isNaN(lat) || isNaN(lon)) { return null; }
    if (parts[0] === name) { parts.shift(); }
    return { lat: lat, lon: lon, name: name, detail: parts.join(', ') };
  }

  function search() {
    var query = $('searchInput').value.replace(/^\s+|\s+$/g, '');
    dialogTouched = Date.now();
    if (!query) { return; }
    var token = ++searchToken;
    $('searchInput').blur(); /* lowers the keyboard so the results can be seen */
    window.scrollTo(0, 0);
    $('results').innerHTML = '';
    setText('searchMsg', 'Searching…');

    var done = false;
    function fail() {
      if (done) { return; }
      done = true;
      if (token === searchToken) { setText('searchMsg', 'Can’t search right now. Check the connection and try again.'); }
    }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', SEARCH_URL + encodeURIComponent(query));
    xhr.timeout = 20000;
    xhr.onload = function () {
      if (done) { return; }
      var list = null;
      try { list = xhr.status === 200 ? JSON.parse(xhr.responseText) : null; } catch (e) { list = null; }
      if (!list || typeof list.length !== 'number') { fail(); return; }
      done = true;
      if (token !== searchToken) { return; }
      var found = 0;
      for (var i = 0; i < list.length; i++) {
        var result = parseResult(list[i]);
        if (result) { addResult(result); found++; }
      }
      setText('searchMsg', found ? '' : 'No places found. Try a different spelling or a nearby city.');
    };
    xhr.onerror = xhr.ontimeout = xhr.onabort = fail;
    xhr.send();
  }

  /* ---------- Saved data ---------- */

  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }

  function load(key) {
    try { return JSON.parse(localStorage.getItem(key)); } catch (e) { return null; }
  }

  function loadSaved() {
    var savedPlace = load(PLACE_KEY);
    if (savedPlace && typeof savedPlace.lat === 'number' && typeof savedPlace.lon === 'number') {
      place = savedPlace;
      locationDenied = !!savedPlace.denied;
    }
    var saved = load(WEATHER_KEY);
    if (place && saved && samePlace(saved, place) && saved.data && saved.data.daily && saved.data.current) {
      weather = saved;
      nextFetch = saved.fetchedAt + REFRESH_EVERY;
    }
  }

  /* ---------- Fetching weather ---------- */

  function fetchWeather() {
    fetching = true;
    var forPlace = place;
    var done = false;
    function finish(ok) {
      if (done) { return; }
      done = true;
      fetching = false;
      nextFetch = Date.now() + (ok ? REFRESH_EVERY : RETRY_AFTER);
    }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', WEATHER_URL + '&latitude=' + forPlace.lat + '&longitude=' + forPlace.lon + '&_=' + Date.now());
    xhr.timeout = 20000;
    xhr.onload = function () {
      var ok = false;
      if (xhr.status === 200) {
        try {
          var data = JSON.parse(xhr.responseText);
          if (data.current && data.daily && data.daily.time) {
            ok = true;
            if (samePlace(forPlace, place)) {
              weather = { data: data, fetchedAt: Date.now(), lat: forPlace.lat, lon: forPlace.lon };
              save(WEATHER_KEY, weather);
              renderWeather();
            } else {
              nextFetch = 0; /* moved while this was loading: fetch again */
            }
          }
        } catch (e) { ok = false; }
      }
      var refetch = ok && !samePlace(forPlace, place);
      finish(ok);
      if (refetch) { nextFetch = 0; }
    };
    xhr.onerror = xhr.ontimeout = xhr.onabort = function () { finish(false); };
    xhr.send();
  }

  /* Reload around 4 a.m. to clear any long-running browser buildup, but only
     after checking the page is reachable: reloading while offline would swap
     the clock for an error screen with nothing to bring it back. */
  function maybeReload(now) {
    var d = new Date(now);
    if (dialogOpen || d.getHours() !== 4 || now - loadedAt < 20 * HOUR || now < nextReloadCheck) { return; }
    nextReloadCheck = now + 5 * MINUTE;
    var xhr = new XMLHttpRequest();
    xhr.open('GET', location.pathname + '?ping=' + now);
    xhr.timeout = 20000;
    xhr.onload = function () {
      if (xhr.status === 200) { location.reload(); }
    };
    xhr.send();
  }

  function isDarkTime(hour) {
    if (forcedMode) { return forcedMode === 'dark'; }
    return hour >= CONFIG.darkFromHour || hour < CONFIG.darkUntilHour;
  }

  /* One-second tick. Comparing against the clock (rather than relying on long
     timers) means everything catches up immediately after the iPad wakes. */
  function tick() {
    var nowDate = new Date();
    var now = nowDate.getTime();

    var dark = isDarkTime(nowDate.getHours());
    if (dark !== lastDark) {
      lastDark = dark;
      document.documentElement.className = dark ? 'dark' : '';
    }

    var time = formatTime(nowDate);
    if (time !== lastTime) {
      lastTime = time;
      setText('time', time);
    }

    var day = dayKey(nowDate);
    if (day !== lastDay) {
      var firstRun = lastDay === '';
      lastDay = day;
      setText('date', DAYS[nowDate.getDay()] + ', ' + MONTHS[nowDate.getMonth()] + ' ' + nowDate.getDate());
      renderWeather();
      if (!firstRun) { nextFetch = 0; } /* new day: get today's low and high straight away */
    }

    if (!place && !locating && now >= nextLocate) { detectPlace(); }
    if (place && isEstimate(place) && !place.denied && !locating && now >= nextDeviceCheck) { checkDeviceLocation(now); }
    if (dialogOpen && now - dialogTouched > DIALOG_IDLE) { closeDialog(); }
    if (place && !fetching && now >= nextFetch) { fetchWeather(); }
    renderStatus(now);
    maybeReload(now);
  }

  /* Stop the page rubber-banding when the screen is touched. */
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });

  /* A real or chosen location is remembered, so an unattended reload doesn't
     bring up a permission prompt. Tapping the place name lets you change it. */
  $('place').addEventListener('click', openDialog);
  $('closeDialog').addEventListener('click', closeDialog);
  $('useDevice').addEventListener('click', function () {
    locationDenied = false;
    locateToken++;
    locating = false;
    closeDialog();
    detectPlace();
  });
  $('searchForm').addEventListener('submit', function (e) {
    e.preventDefault();
    search();
  });
  $('dialogBox').addEventListener('click', function () { dialogTouched = Date.now(); });
  $('searchInput').addEventListener('input', function () { dialogTouched = Date.now(); });

  loadSaved();
  renderPlace();
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
